<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoxEngine · QR pointage caisse</title>
<style>
  :root{--bleu:#0b3d91;--bleuf:#082d6b;--rouge:#ad0000;--vert:#1e7a46;--gris:#5b6472;--grisc:#eef1f5;--txt:#2b2f36;--bg:#f6f8fc;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .top{background:var(--bleu);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .top .b{font-weight:700}
  .wrap{max-width:560px;margin:18px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(10,30,80,.04)}
  h2{font-size:16px;color:var(--bleu);margin:0 0 12px}
  label{font-size:13px;color:var(--gris);font-weight:600;margin-right:8px}
  select,input{padding:9px;border:1.5px solid #d4dbe8;border-radius:9px;font-size:14px;background:#fff}
  .btn{cursor:pointer;border:none;border-radius:9px;padding:9px 14px;font-weight:700;color:#fff;background:var(--bleu);font-size:14px}
  .btn.ghost{background:#fff;color:var(--bleu);border:1.5px solid var(--bleu)}
  .hide{display:none} .muted{color:#9aa4b2;font-size:13px}
  .login{max-width:380px;margin:60px auto}
  .msg{font-size:14px;padding:10px 12px;border-radius:10px;margin-top:10px}
  .msg.err{background:#fdeaea;color:var(--rouge)}.msg.ok{background:#e9f6ee;color:var(--vert)}
  .qrbox{text-align:center;padding:10px}
  #qr{display:inline-block;background:#fff;padding:16px;border-radius:16px;border:1px solid #e3e8f0}
  #qr img,#qr canvas{display:block}
  .bnom{font-size:22px;font-weight:800;color:var(--bleuf);margin:4px 0 2px}
  .cons{font-size:15px;color:var(--gris);margin-top:8px}
  .count{font-size:13px;color:#9aa4b2;margin-top:10px}
  .dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--vert);margin-right:6px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
</style>
</head>
<body>
<div class="top"><div class="b">FoxEngine · QR pointage caisse</div>
  <button id="btnOut" class="btn ghost hide" onclick="signOut()">Déconnexion</button></div>

<!-- Connexion -->
<div id="login" class="login card">
  <h2>Connexion caisse</h2>
  <p class="muted">Compte FoxManager de la boutique (responsable ou caisse).</p>
  <div><label>E-mail</label><br><input id="email" type="email" style="width:100%;margin-top:6px"></div>
  <div style="margin-top:10px"><label>Mot de passe</label><br><input id="pass" type="password" style="width:100%;margin-top:6px"></div>
  <button class="btn" style="margin-top:14px;width:100%" onclick="signIn()">Se connecter</button>
  <div id="loginMsg"></div>
</div>

<!-- Ecran QR -->
<div id="app" class="wrap hide">
  <div class="card">
    <label>Boutique</label>
    <select id="selBoutique" onchange="start()"></select>
    <button class="btn ghost" style="float:right" onclick="goFull()">Plein écran</button>
  </div>
  <div class="card qrbox">
    <div class="bnom" id="bnom"></div>
    <div class="cons">Pointage du personnel : scannez ce code avec l'app salarié.</div>
    <div style="margin:18px 0"><div id="qr"></div></div>
    <div style="font-size:12px;color:#9aa4b2;margin-top:4px">Code manuel (si la caméra ne marche pas) :</div>
    <div id="tok" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:2px;font-weight:700;color:#082d6b;margin-top:2px">—</div>
    <div class="count"><span class="dotlive"></span><span id="count">Code actif, renouvelé automatiquement.</span></div>
    <div id="qrMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://cxbyblnzlivnadyhdwtz.supabase.co';
  var SUPABASE_KEY='sb_publishable_XjTXt9N9A-zBhu6lZfrxXw_Hxwfi3wp';
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  var ST={role:'',stores:[],boutique:'',timer:null,qr:null};

  function $(id){return document.getElementById(id);}
  function msg(el,t,ok){el.innerHTML=t?'<div class="msg '+(ok?'ok':'err')+'">'+t+'</div>':'';}
  function claims(s){try{var t=s.access_token.split('.')[1];return JSON.parse(atob(t.replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return {};}}

  window.signIn=async function(){
    msg($('loginMsg'),'',true);
    var r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
    if(r.error){msg($('loginMsg'),'Identifiants incorrects.',false);return;}
    boot(r.data.session);
  };
  window.signOut=async function(){if(ST.timer)clearInterval(ST.timer);await sb.auth.signOut();location.reload();};

  async function boot(session){
    var c=claims(session);var meta=c.app_metadata||{};
    ST.role=meta.role_code||'';ST.stores=Array.isArray(meta.allowed_stores)?meta.allowed_stores:[];
    if(['SA','MANAGER','STAFF'].indexOf(ST.role)<0){msg($('loginMsg'),'Accès réservé au personnel de la boutique.',false);sb.auth.signOut();return;}
    $('login').classList.add('hide');$('app').classList.remove('hide');$('btnOut').classList.remove('hide');
    var list=ST.stores.slice();
    if(ST.role==='SA'){var r=await sb.rpc('rpc_pt_boutiques_actives');if(!r.error&&r.data){r.data.forEach(function(b){if(list.indexOf(b.id)<0)list.push(b.id);});}}
    var sel=$('selBoutique');sel.innerHTML='';
    if(!list.length){sel.innerHTML='<option>Aucune boutique</option>';return;}
    list.forEach(function(id){var o=document.createElement('option');o.value=id;o.textContent=id;sel.appendChild(o);});
    ST.boutique=list[0];start();
  }

  function render(text){
    var box=$('qr');box.innerHTML='';
    ST.qr=new QRCode(box,{text:text,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
  }

  async function tick(){
    var r=await sb.rpc('rpc_pt_caisse_qr',{p_boutique:ST.boutique});
    if(r.error){msg($('qrMsg'),'Code indisponible : '+(r.error.message||''),false);return;}
    msg($('qrMsg'),'',true);
    $('bnom').textContent=r.data.boutique;
    $('tok').textContent=r.data.token;
    render(r.data.payload);
  }

  window.start=function(){
    ST.boutique=$('selBoutique').value;
    if(ST.timer)clearInterval(ST.timer);
    tick();
    ST.timer=setInterval(tick,20000);
  };

  window.goFull=function(){var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();};

  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)boot(r.data.session);});
})();
</script>
</body>
</html>
